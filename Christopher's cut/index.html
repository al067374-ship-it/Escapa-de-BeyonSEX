<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="app.css">
    <title>Escapa de Beyoncé</title>
</head>
<body>

    <h1>Escapa de Beyoncé</h1>

    <div id="config-panel">
        <label>
            <input type="checkbox" id="dark-mode-toggle"> Modo Oscuro
        </label>
        <br>
        <label for="player-speed">Velocidad del Jugador: <span id="player-speed-value">40</span></label>
        <input type="range" id="player-speed" min="10" max="100" value="40" step="5">
        <br>
        <label for="enemy-speed">Velocidad de Beyoncé: <span id="enemy-speed-value">1</span></label>
        <input type="range" id="enemy-speed" min="0.5" max="10" value="1" step="0.5">
    </div>

    <div id="game-area">
        <div id="player" class="character"></div>
        <div id="beyonce" class="character"></div>
    </div>

    <script type="text/javascript" src="app.js"></script>

</body>
</html>
